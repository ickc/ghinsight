[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghinsight"
version = "0.2.0"
description = "Reusable tools for GitHub analysis: Actions usage, issue and PR activity, and a small API client"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = ["github", "actions", "metrics", "analysis", "dashboard", "activity"]
dependencies = [
    "httpx2>=2.16",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# GitHub Actions usage and performance analysis, with its dashboard.
actions = [
    "pandas>=2.0",
    "plotly>=6.0",
    "rich>=13.0",
]

[project.scripts]
ghinsight = "ghinsight.cli:app"

[project.urls]
Homepage = "https://github.com/ickc/ghinsight"
Repository = "https://github.com/ickc/ghinsight"
Issues = "https://github.com/ickc/ghinsight/issues"

[dependency-groups]
dev = [
    "ghinsight[actions]",
    "build>=1.3",
    "twine>=6.0",
    "pytest>=8.0",
]
docs = [
    "ghinsight[actions]",
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "myst-nb>=1.0",
    "sphinx-autoapi>=3.0",
    "jupytext>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghinsight"]

[tool.uv]
package = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "linux-ppc64le", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.15"
typer = ">=0.12"
pandas = ">=2.0"
plotly = ">=6.0"
httpx2 = ">=2.16"
rich = ">=13.0"
pytest = ">=8.0"

[tool.pixi.pypi-dependencies]
ghinsight = { path = ".", editable = true }

[tool.pixi.tasks]
check = { cmd = "python -m compileall src bin", description = "Compile Python sources." }
test = { cmd = "pytest", description = "Run the offline test suite." }
help = { cmd = "ghinsight --help", description = "Show the CLI help." }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pixi.environments]
default = { solve-group = "default" }
